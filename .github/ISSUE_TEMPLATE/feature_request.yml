name: Feature request
description: Propose a focused product improvement
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: checkboxes
    id: fit
    attributes:
      label: Product fit
      options:
        - label: This keeps Tampr local-first.
        - label: This does not require broad new permissions without a clear user action.
        - label: This keeps the runtime and UI lightweight.
