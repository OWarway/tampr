name: Bug report
description: Report a reproducible Tampr problem
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Tampr steadier. For vulnerabilities, please follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Save...
        3. See...
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: 'Chrome 138'
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Windows 11'
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add console errors, screenshots, or exported test data if useful. Remove sensitive snippets first.
